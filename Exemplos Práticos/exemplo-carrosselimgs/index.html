
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Carrossel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">

        <div id="meuCarrossel" class="carousel slide">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/10/800/350"
                         class="d-block w-100" alt="Paisagem 1">
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/15/800/350"
                         class="d-block w-100" alt="Paisagem 2">
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/28/800/350"
                         class="d-block w-100" alt="Paisagem 3">
                </div>

            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#meuCarrossel"
                    data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#meuCarrossel"
                    data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
